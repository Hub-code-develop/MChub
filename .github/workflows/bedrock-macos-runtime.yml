name: bedrock-macos-runtime

# macOS 上运行 Windows GDK 版基岩版所需的运行时:
#   wine/       —— WineGDK 分支的 Wine(x86_64),含 xgameruntime.dll(PE) 与 xgameruntime.so(unix)
#   xodus/      —— 原生 xodus-service,负责 MSA/XSTS/许可,监听 /tmp/xodus.sock
#   render/     —— MoltenVK、DXVK、vkd3d-proton,以及 Wine 运行期需要的 Vulkan loader / FreeType
#   winappsdk/  —— WinAppSDK 引导器桩(替换实例内那个在 Wine 下必然失败的 Bootstrap DLL)
#   native-components/ —— MChub.Preload.dll / MChub.Bootstrap.dll 的新鲜构建(Windows x64),
#                    作为独立工件 mcbe-macos-native-components 上传,供 mac-dmg 在 BundleApp
#                    之前回填,替换仓库里陈旧的 Portal 品牌产物。
#   vulkan-loader/ —— 自建 Khronos Vulkan loader(brew 无 macOS Intel bottle)。
#                    构建 Wine 时要先下载它,configure 的 vulkan 检测是 -lvulkan 链接检查;
#                    汇总时再并入 render/lib,供运行期 dlopen。
#
# 由 mac-dmg 通过 workflow_call 调用,产物以 mcbe-macos-runtime 工件上传,
# 打包时解到 MChub.app/Contents/MacOS/mcbe-macos(MChub.Bedrock.MacOS 会在该路径下探测)。

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  WINE_GDK_REPO: https://github.com/Weather-OS/WineGDK.git
  WINE_GDK_REF: b03ba49c4f326c36aa6930fbe6cf72841ef3738c
  XODUS_REPO: https://github.com/xodus-gaming/xodus.git
  XODUS_REF: main
  MOLTENVK_VERSION: 1.4.2
  DXVK_VERSION: 3.1.1
  VKD3D_PROTON_VERSION: 3.0.1

jobs:
  xodus-service:
    name: xodus-service (native macOS)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-xodus-${{ hashFiles('.github/workflows/bedrock-macos-runtime.yml') }}

      - name: 安装 protobuf(xodus 的 build script 需要 protoc)
        run: brew install --quiet protobuf

      - name: 构建 xodus-service
        run: ./scripts/mcbe-macos/build-xodus-service.sh

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: mcbe-macos-xodus-service
          path: artifacts/runtime/xodus
          if-no-files-found: error

  render-stack:
    name: render stack (MoltenVK/DXVK/vkd3d-proton)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: 收集渲染栈
        run: ./scripts/mcbe-macos/fetch-render-stack.sh

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: mcbe-macos-render-stack
          path: artifacts/runtime/render
          if-no-files-found: error

  winappsdk-stub:
    name: WinAppSDK bootstrapper stub (windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 mingw-w64 交叉编译器
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: 编译引导器桩
        run: ./scripts/mcbe-macos/build-winappsdk-stub.sh

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: mcbe-macos-winappsdk-stub
          path: artifacts/runtime/winappsdk
          if-no-files-found: error

  native-components:
    name: native components (MChub.Preload / MChub.Bootstrap, windows x64)
    runs-on: windows-latest
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      # 仓库里提交的 MChub.Preload.dll / MChub.Bootstrap.dll 是早期 Portal 品牌的手工构建产物,
      # 会被 MChub.Bedrock.MacOS 内嵌并在 Wine 下部署到实例目录,导致运行日志/目录仍显示 Portal。
      # 这里从当前源码重建,并由 mac-dmg 在 BundleApp 之前回填到工程目录。
      - name: 构建 MChub.Preload(NativeAOT win-x64 共享库)
        shell: pwsh
        run: |
          dotnet publish src/MChub.Bedrock.Preload/MChub.Bedrock.Preload.csproj -c Release

      - name: 添加 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 构建 MChub.Bootstrap(MSVC x64)
        shell: pwsh
        run: |
          msbuild src/MChub.Bedrock.Bootstrap/MChub.Bedrock.Bootstrap.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: 汇总产物
        shell: bash
        run: |
          mkdir -p artifacts/runtime/native-components
          cp src/MChub.Bedrock.Preload/MChub.Preload.dll artifacts/runtime/native-components/
          cp src/MChub.Bedrock.Bootstrap/MChub.Bootstrap.dll artifacts/runtime/native-components/
          ls -l artifacts/runtime/native-components

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: mcbe-macos-native-components
          path: artifacts/runtime/native-components
          if-no-files-found: error

  vulkan-loader:
    name: Vulkan loader (macOS x86_64, 自建)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: 安装 CMake
        run: brew install --quiet cmake

      - name: 构建 Vulkan-Loader
        run: ./scripts/mcbe-macos/build-vulkan-loader.sh

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: mcbe-macos-vulkan-loader
          path: artifacts/runtime/vulkan-loader
          if-no-files-found: error

  runtime:
    name: runtime (Wine x86_64 + xodus + 渲染栈)
    runs-on: macos-15-intel
    needs: [ xodus-service, render-stack, winappsdk-stub, vulkan-loader ]
    steps:
      - uses: actions/checkout@v7

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Caches/Homebrew/downloads || true
          sudo rm -rf /usr/local/Homebrew/Library/Taps || true
          df -h /

      - name: 下载 Vulkan loader(configure 检测 -lvulkan 需要,必须先于 Wine 构建)
        uses: actions/download-artifact@v7
        with:
          name: mcbe-macos-vulkan-loader
          path: artifacts/runtime/vulkan-loader

      - name: 缓存 Wine 构建结果
        id: wine-cache
        uses: actions/cache@v4
        with:
          path: artifacts/runtime/wine
          # v3:Wine 需带 Vulkan 支持(configure 的 -lvulkan 链接检查),且构建时
          # 额外传入了 VULKAN_LOADER_DIR;旧缓存产物不含 Vulkan,必须重编。
          # v4:build-wine.sh 为 xgameruntime 的 QueryApiImpl 补了 CLSID_XUserImpl 分支
          # (未登录账户启动时游戏要 QueryApiImpl(CLSID_XUserImpl),否则 abort 退出码 3);
          # 旧缓存不含该补丁,必须重编。
          # v5:build-wine.sh 另按 GDK 语义实现了 XUser.cpp 的
          # XUserAddAsync/XUserAddResult(未登录时以 E_GAMEUSER_NO_DEFAULT_USER
          # 完成异步块,而不是返回 E_NOTIMPL 且永不完成 —— 后者会让基岩版抛 C++
          # 异常并 abort)。旧缓存仍是桩实现,必须重编。
          # v6:build-wine.sh 把 XAsyncSchedule 的 TRACE 移到 state.Detach() 之前。
          # 原来 Detach() 之后才打印 state->queue,而此时智能指针已置空,只要开启
          # gdkc 日志通道就会在 xgameruntime+0x5490 空指针崩溃(读 0x78),使任何
          # gdkc 调试都变成假崩溃。旧缓存含该缺陷,必须重编。
          key: wine-gdk-${{ env.WINE_GDK_REF }}-${{ runner.os }}-${{ runner.arch }}-v6

      - name: 构建 Wine(WineGDK,x86_64)
        if: steps.wine-cache.outputs.cache-hit != 'true'
        env:
          VULKAN_LOADER_DIR: ${{ github.workspace }}/artifacts/runtime/vulkan-loader
        run: ./scripts/mcbe-macos/build-wine.sh

      - name: Wine 缓存命中,校验产物
        if: steps.wine-cache.outputs.cache-hit == 'true'
        run: |
          test -x artifacts/runtime/wine/bin/wine
          test -f artifacts/runtime/wine/lib/wine/x86_64-windows/xgameruntime.dll
          test -f artifacts/runtime/wine/lib/wine/x86_64-unix/xgameruntime.so
          if strings artifacts/runtime/wine/lib/wine/x86_64-unix/win32u.so | grep -q "built without Vulkan"; then
            echo "::error::缓存的 Wine 不含 Vulkan 支持,请删除缓存后重编"
            exit 1
          fi
          artifacts/runtime/wine/bin/wine --version || true

      - name: 下载 xodus-service
        uses: actions/download-artifact@v7
        with:
          name: mcbe-macos-xodus-service
          path: artifacts/runtime/xodus

      - name: 下载渲染栈
        uses: actions/download-artifact@v7
        with:
          name: mcbe-macos-render-stack
          path: artifacts/runtime/render

      - name: 下载 WinAppSDK Bootstrapper 桩
        uses: actions/download-artifact@v7
        with:
          name: mcbe-macos-winappsdk-stub
          path: artifacts/runtime/winappsdk

      - name: 确保可执行位
        run: chmod +x artifacts/runtime/xodus/xodus-service

      - name: 汇总并自检
        env:
          WINE_GDK_REF: ${{ env.WINE_GDK_REF }}
          XODUS_REF: ${{ env.XODUS_REF }}
        run: ./scripts/mcbe-macos/assemble-runtime.sh

      - name: 上传运行时
        uses: actions/upload-artifact@v7
        with:
          name: mcbe-macos-runtime
          path: artifacts/runtime
          if-no-files-found: error