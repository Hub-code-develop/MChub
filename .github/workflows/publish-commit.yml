name: publish/commit

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 同一通道必须串行：多次推送并发跑会互相删除 / 覆盖同一个 release。
# commit 通道只关心「最新快照」，所以新推送直接取消仍在跑的旧构建。
concurrency:
  group: publish-commit
  cancel-in-progress: true

# 显式收敛 GITHUB_TOKEN 权限（对应 CodeQL: actions/missing-workflow-permissions）。
# 与已验证可用的 publish-release.yml 取同一组合 —— 这两个权限就是发布流程实际需要的全部：
#   contents: write  创建/更新 release、上传资产（gh release create/upload）
#   packages: read   从 GitHub Packages 还原基座库 CodeHub-FluentUI
# 仓库级默认是「读写全部」，这里收紧到最小集。
# 注：下载本工作流内其它 job 的 artifact 走 ACTIONS_RUNTIME_TOKEN，不需要额外权限。
permissions:
  contents: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_json: ${{ steps.meta.outputs.json }}
      app_version: ${{ steps.meta.outputs.app_version }}
      commit: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate Meta and JSON
        id: meta
        run: |
          BASE_VERSION=$(cat ./assets/conf/version.txt | tr -d '[:space:]')
          Y_FULL=$(TZ='Asia/Shanghai' date +'%Y')
          MD=$(TZ='Asia/Shanghai' date +'%m%d')
          HM=$(TZ='Asia/Shanghai' date +'%H%M')
          FULL_TIMESTAMP="${Y_FULL}${MD}${HM}"
          START_EPOCH=$(TZ='Asia/Shanghai' date -d "2026-07-10 00:00:00" +%s)
          NOW_EPOCH=$(date +%s)
          TOTAL_MINUTES=$(( (NOW_EPOCH - START_EPOCH) / 60 ))
          TOTAL_DAYS=$(( TOTAL_MINUTES / 1440 ))
          ELAPSED_HOURS=$(( (TOTAL_MINUTES % 1440) / 60 ))
          ELAPSED_MINUTES=$(( TOTAL_MINUTES % 60 ))
          APP_VERSION="0.${TOTAL_DAYS}.${ELAPSED_HOURS}.${ELAPSED_MINUTES}"
          COMMIT_HASH=$(git rev-parse --short=6 HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date -Iseconds)
          VERSION_TITLE="build-commit-${APP_VERSION}-${{ github.run_id }}-${COMMIT_HASH}"
          JSON_STRING="{\"type\":\"commit\",\"build-time\":\"${BUILD_TIME}\",\"action\":\"${{ github.run_id }}\",\"commit\":\"${COMMIT_HASH}\",\"version\":\"${BASE_VERSION}\",\"timestamp\":\"${FULL_TIMESTAMP}\",\"version_title\":\"${VERSION_TITLE}\"}"
          echo "json=${JSON_STRING}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT

  linux-package:
    runs-on: ubuntu-22.04
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: appimage
            package_type: appimage
            runtime: linux-x64
            output: MChub.linux.x64.AppImage
          - kind: deb
            package_type: deb
            runtime: linux-x64
            output: MChub.linux.x64.deb
          - kind: rpm
            package_type: rpm
            runtime: linux-x64
            output: MChub.linux.x64.rpm
          - kind: appimage
            package_type: appimage
            runtime: linux-arm64
            output: MChub.linux.arm64.AppImage
          - kind: deb
            package_type: deb
            runtime: linux-arm64
            output: MChub.linux.arm64.deb
          # rpm arm64 skipped: rpmbuild on x86_64 runner cannot cross-compile
          # arm64 packages. Users on arm64 Linux should use the .deb or
          # AppImage builds instead.
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo '${{ matrix.package_type }}' > ./assets/conf/package-type.txt

      - name: Dependency
        run: |
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0
          sudo apt-get update && sudo apt-get install -y fuse rpm

      - name: Build ${{ matrix.kind }} Package
        run: |
          cd ./assets/conf
          pupnet --runtime ${{ matrix.runtime }} --kind ${{ matrix.kind }} -o ${{ matrix.output }} -y --app-version ${{ needs.prepare.outputs.app_version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}-${{ matrix.kind }}-artifacts
          path: assets/conf/Deploy/OUT/${{ matrix.output }}

  win-exe:
    runs-on: windows-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'portable' > ./assets/conf/package-type.txt
        shell: bash

      - name: Build & Package
        shell: pwsh
        run: |
          cd ./src/MChub.Desktop
          New-Item -ItemType Directory -Force -Path "../../dist"
          dotnet restore -r ${{ matrix.runtime }}
          dotnet publish -c Release -r ${{ matrix.runtime }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false /p:Version=${{ needs.prepare.outputs.app_version }} -o "../../dist" -p:DebugType=none -p:DebugSymbols=false
          cd "../../dist"
          Rename-Item -Path "MChub.Desktop.exe" -NewName "MChub.win.${{ matrix.arch }}.portable.exe" -Force
          Compress-Archive -Path "MChub.win.${{ matrix.arch }}.portable.exe" -DestinationPath "../MChub.win.${{ matrix.arch }}.portable.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-exe-win.${{ matrix.arch }}-artifacts
          path: ./MChub.*.zip

  win-installer:
    runs-on: windows-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Dependencies
        run: |
          choco install innosetup -y
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0

      - name: Chinesize-InnoSetup
        run: Copy-Item "./assets/conf/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Default.isl" -Force

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'installer' > ./assets/conf/package-type.txt
        shell: bash

      - name: Build & Package
        shell: pwsh
        run: |
          cd ./assets/conf
          pupnet -r ${{ matrix.runtime }} -k setup -y -o MChub.win.${{ matrix.arch }}.installer.exe --app-version ${{ needs.prepare.outputs.app_version }}
          ../../scripts/configure-windows-installer.ps1 -Runtime ${{ matrix.runtime }}
          Compress-Archive -Path "Deploy/OUT/MChub.win.${{ matrix.arch }}.installer.exe" -DestinationPath "Deploy/OUT/MChub.win.${{ matrix.arch }}.installer.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-installer-win.${{ matrix.arch }}-artifacts
          path: assets/conf/Deploy/OUT/MChub.win.*.installer.zip

  # 基岩版在 macOS 上没有原生客户端，靠 Wine(WineGDK) + xodus-service 跑 Windows GDK 版；
  # 运行时由可复用的 bedrock-macos-runtime.yml 构建，再内嵌进 .app。
  bedrock-macos-runtime:
    name: bedrock-macos-runtime
    uses: ./.github/workflows/bedrock-macos-runtime.yml

  mac-dmg:
    runs-on: macos-latest
    needs: [prepare, bedrock-macos-runtime]
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
        include:
          - rid: osx-x64
            dmg_arch: x64
          - rid: osx-arm64
            dmg_arch: arm64
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup CodeNet SDK (macOS 定制版 .NET)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODENET_VER="10.0.400"
          # 统一用 x64 SDK 交叉构建（含 osx-arm64）：
          # arm64 的 CodeNet SDK 在 macOS 26 arm64 runner 上 signalfix 有竞态，
          # dotnet restore -r osx-arm64 概率性 Segmentation fault 139（实测 run 35596627434）。
          # x64 SDK 稳定，且其 packs 里自带 signalfix 版 arm64 原生库
          # （libcoreclr 6144016 / libclrjit 3061968 / libclrgc 882208 / libclrgcexp 960800），
          # 因此 x64 宿主交叉构建出的 arm64 产物同样是修复版。x64 宿主在 arm64 runner 上可运行（有 Rosetta）。
          ASSET="dotnet-codenet-osx-x64.tar.gz"
          DEST="$RUNNER_TEMP/codenet"
          mkdir -p "$DEST"
          echo "从 Open-code-Studio/CodeNet 发布下载定制版 .NET SDK (sdk-v${CODENET_VER}, x64 → 交叉构建 ${{ matrix.rid }}) ..."
          gh release download "sdk-v${CODENET_VER}" -R Open-code-Studio/CodeNet -p "$ASSET" -D "$DEST"
          tar xzf "$DEST/$ASSET" -C "$DEST"
          echo "DOTNET_ROOT=$DEST/dotnet11x64" >> "$GITHUB_ENV"
          echo "$DEST/dotnet11x64" >> "$GITHUB_PATH"
          "$DEST/dotnet11x64/dotnet" --version
          "$DEST/dotnet11x64/dotnet" --info 2>/dev/null | grep Architecture

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'app' > ./assets/conf/package-type.txt

      - name: Download Bedrock native components
        uses: actions/download-artifact@v7
        with:
          name: mcbe-macos-native-components
          path: .native-components

      - name: Install Bedrock native components
        run: |
          # MacOS 工程把这两个 DLL 内嵌为 EmbeddedResource(BundleApp 时读取),
          # 必须在构建 App 之前就位;否则内嵌的仍是仓库里陈旧的 Portal 构建产物。
          cp .native-components/MChub.Preload.dll ./src/MChub.Bedrock.Preload/MChub.Preload.dll
          cp .native-components/MChub.Bootstrap.dll ./src/MChub.Bedrock.Bootstrap/MChub.Bootstrap.dll
          ls -l ./src/MChub.Bedrock.Preload/MChub.Preload.dll ./src/MChub.Bedrock.Bootstrap/MChub.Bootstrap.dll

      - name: Build macOS App
        run: |
          cd ./src/MChub.Desktop
          # CodeNet x64 SDK 在 Rosetta 下交叉构建 osx-arm64 会概率性死锁：
          # 轻则卡在 restore 的 "Determining projects to restore..."，
          # 重则 BundleApp 编译阶段静默挂起直到 GitHub 6h 超时（实测多次）。
          # 给每个 dotnet 调用套 600s 超时，挂起即 kill 重试，最多 3 次。
          run_with_timeout() {
            local label="$1"; shift
            for attempt in 1 2 3; do
              echo "== $label attempt $attempt =="
              dotnet "$@" &
              local pid=$!
              ( sleep 600; kill -9 "$pid" 2>/dev/null ) &
              local killer=$!
              # GitHub 默认 shell 带 -e，wait 直接返回非 0 会终止脚本，导致重试分支永远不执行
              local rc=0
              wait "$pid" || rc=$?
              kill "$killer" 2>/dev/null || true
              if [ "$rc" -eq 0 ]; then
                echo "== $label OK =="
                return 0
              fi
              echo "== $label failed (rc=$rc), retrying =="
              pkill -9 dotnet 2>/dev/null || true
              sleep 5
            done
            echo "== $label gave up after 3 attempts =="
            return 1
          }
          run_with_timeout restore restore -r ${{ matrix.rid }}
          run_with_timeout bundle msbuild -t:BundleApp -p:RuntimeIdentifier=${{ matrix.rid }} -property:Configuration=Release -p:SelfContained=true

      - name: Download Bedrock macOS runtime
        uses: actions/download-artifact@v7
        with:
          name: mcbe-macos-runtime
          path: .runtime

      - name: Embed Bedrock macOS runtime
        run: |
          APP="./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app"
          mkdir -p "$APP/Contents/MacOS/mcbe-macos"
          # MChub.Bedrock.MacOS 在 AppContext.BaseDirectory/mcbe-macos 下探测运行时。
          cp -R ./.runtime/. "$APP/Contents/MacOS/mcbe-macos/"
          # 工件往返会丢失可执行位。ntdll.so 实际 exec 的是 unix 侧 loader
          # (lib/wine/x86_64-unix/wine)，缺 x 位时报 "could not exec the wine loader"。
          chmod +x "$APP/Contents/MacOS/mcbe-macos/wine/bin/"* || true
          chmod +x "$APP/Contents/MacOS/mcbe-macos/wine/lib/wine/x86_64-unix/wine"
          chmod +x "$APP/Contents/MacOS/mcbe-macos/xodus/xodus-service"
          ls -l "$APP/Contents/MacOS/mcbe-macos"

      # DotNet.Bundle 不支持 CFBundleURLTypes，mchub:// 协议声明在打包后写入 Info.plist
      - name: Declare mchub URL Scheme
        run: |
          PLIST="./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string hub.code.mchub" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLRole string Viewer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string mchub" "$PLIST"

      # 打包前 MChub.app 只带着 apphost 的 ad-hoc 签名（.NET/DotNet.Bundle 自动施加）。
      # 上面又往 Contents/MacOS 塞了 Bedrock 运行时、并用 PlistBuddy 改写了 Info.plist，
      # bundle 级签名与内容因此不一致 —— codesign --verify 会报
      #   "code has no resources but signature indicates they must be present"
      # 这种包在 Gatekeeper 开启的机器上会被拒（本机因 Gatekeeper 已关而看不出来）。
      # 所以必须在 ditto / 建 DMG / pkgbuild 之前整包重签一次。
      # 用 ad-hoc（-）：不需要证书、不需要付费开发者账号，但能保证签名一致，
      # 并满足 Apple Silicon「arm64 二进制必须带签名」的硬要求。
      # 注意：ad-hoc 不等于公证 —— 用户从浏览器下载后首次打开仍需右键→打开。
      - name: Sign app bundle (ad-hoc)
        run: |
          set -euo pipefail
          APP="./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app"
          VULKAN_DIR="$APP/Contents/MacOS/mcbe-macos/render/vulkan"
          # macOS 把 ".d" 目录当成 bundle，codesign --deep 扫到
          #   .../render/vulkan/icd.d
          # 会直接以 "bundle format unrecognized, invalid, or unsuitable" 失败。
          # 绕过：真实目录留在 icd_d，用符号链接 icd.d 指回去 ——
          # codesign 不跟随符号链接（因此跳过），而运行时路径
          # ".../vulkan/icd.d/MoltenVK_icd.json" 仍能解析（实测可读）。
          # 这与目录名无关：Vulkan 的 ICD 是由环境变量 VK_ICD_FILENAMES / VK_DRIVER_FILES
          # 指向该 JSON 文件来定位的（见 MChub.Bedrock.MacOS/Runtime/WineEnvironment.cs）。
          # 幂等；符号链接经 ditto 打包往返后仍保留（实测解包后 codesign --verify 通过）。
          if [ -d "$VULKAN_DIR/icd.d" ] && [ ! -L "$VULKAN_DIR/icd.d" ]; then
            mv "$VULKAN_DIR/icd.d" "$VULKAN_DIR/icd_d"
            ln -s icd_d "$VULKAN_DIR/icd.d"
            echo "已把 icd.d 换成符号链接（codesign --deep 不跟随符号链接）"
          fi
          # --force 覆盖 apphost 的旧 adhoc 签名；--deep 递归处理嵌套代码（含数百个托管 dll）
          codesign --force --deep --sign - "$APP"
          # 自检：刚签完必须校验通过，否则不要把签名坏的包发出去
          codesign --verify --deep --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier=|Signature=|Sealed" || true

      - name: Package APP to ZIP
        run: |
          cd ./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/
          /usr/bin/ditto -c -k --keepParent MChub.app ../../../../../../../MChub.osx.mac.${{ matrix.dmg_arch }}.app.zip

      # macOS Runner 预装的 aws/tap 未受信任，会导致 brew 输出警告，构建 DMG 前先移除
      - name: Untap Untrusted Homebrew Taps
        run: brew untap aws/tap || true

      - name: Build DMG
        uses: L-Super/create-dmg-actions@v1.1.0
        with:
          dmg_name: "MChub.osx.mac.${{ matrix.dmg_arch }}"
          src_dir: "./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app"

      - name: Build PKG
        run: |
          pkgbuild \
            --root "./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app" \
            --install-location "/Applications/MChub.app" \
            --identifier "hub.code.MChub" \
            --version "${{ needs.prepare.outputs.app_version }}" \
            --timestamp \
            "MChub.osx.mac.${{ matrix.dmg_arch }}.pkg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-${{ matrix.dmg_arch }}-artifacts
          path: |
            ./MChub.osx.mac.${{ matrix.dmg_arch }}.dmg
            ./MChub.osx.mac.${{ matrix.dmg_arch }}.app.zip
            ./MChub.osx.mac.${{ matrix.dmg_arch }}.pkg

  publish:
    needs: [prepare, linux-package, win-exe, win-installer, mac-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./MChub.Release/
          merge-multiple: true

      - name: List Files
        run: ls -la ./MChub.Release/

      - name: Generate Changelog
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          bash .github/scripts/generate-changelog.sh "$REPO_URL" > RELEASE_CHANGELOG.md
          if [ ! -s RELEASE_CHANGELOG.md ] || [ "$(wc -l < RELEASE_CHANGELOG.md)" -le 1 ]; then
            echo "自上一个正式版以来没有新的提交" > RELEASE_CHANGELOG.md
          fi
          cat RELEASE_CHANGELOG.md

      # ⚠ 不要「先删除旧 release 再重建」：那样在"已删、未建"的窗口里
      # GET /releases/tags/publish-commit 会 404 —— 客户端更新检查会直接弹
      # 「网络请求错误: 404」。action-gh-release 对**已存在的 tag** 是"更新"语义，
      # 原地覆盖资产即可，全程保持 release 可用。
      # 代价：tag 指针不再随构建移动 —— 对 commit 通道无影响，版本识别看
      # release 标题里的 run_id + commit 短哈希。
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: publish-commit
          name: "build-commit-${{ needs.prepare.outputs.app_version }}-${{ github.run_id }}-${{ needs.prepare.outputs.commit }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_CHANGELOG.md
          files: |
            ./MChub.Release/*.dmg
            ./MChub.Release/*.zip
            ./MChub.Release/*.pkg
            ./MChub.Release/*.AppImage
            ./MChub.Release/*.deb
            ./MChub.Release/*.rpm
