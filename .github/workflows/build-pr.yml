name: build/pr

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      version_json: ${{ steps.meta.outputs.version_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Generate Meta and JSON
        id: meta
        run: |
          BASE_VERSION=$(cat ./assets/conf/version.txt | tr -d '[:space:]')
          Y_FULL=$(TZ='Asia/Shanghai' date +'%Y')
          MD=$(TZ='Asia/Shanghai' date +'%m%d')
          HM=$(TZ='Asia/Shanghai' date +'%H%M')
          FULL_TIMESTAMP="${Y_FULL}${MD}${HM}"
          START_EPOCH=$(TZ='Asia/Shanghai' date -d "2026-07-10 00:00:00" +%s)
          NOW_EPOCH=$(date +%s)
          TOTAL_MINUTES=$(( (NOW_EPOCH - START_EPOCH) / 60 ))
          TOTAL_DAYS=$(( TOTAL_MINUTES / 1440 ))
          ELAPSED_HOURS=$(( (TOTAL_MINUTES % 1440) / 60 ))
          ELAPSED_MINUTES=$(( TOTAL_MINUTES % 60 ))
          APP_VERSION="0.${TOTAL_DAYS}.${ELAPSED_HOURS}.${ELAPSED_MINUTES}"
          COMMIT_HASH=$(git rev-parse --short=6 HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date -Iseconds)
          VERSION_TITLE="build-commit-${APP_VERSION}-${{ github.run_id }}-${COMMIT_HASH}"
          JSON_STRING="{\"type\":\"commit\",\"build-time\":\"${BUILD_TIME}\",\"action\":\"${{ github.run_id }}\",\"commit\":\"${COMMIT_HASH}\",\"version\":\"${BASE_VERSION}\",\"timestamp\":\"${FULL_TIMESTAMP}\",\"version_title\":\"${VERSION_TITLE}\"}"
          echo "json=${JSON_STRING}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT

  win-x64-build:
    runs-on: windows-latest
    needs: prepare
    env:
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'pr' > ./assets/conf/package-type.txt

      - name: Build & Package (Windows x64)
        shell: pwsh
        run: |
          cd ./src/MChub.Desktop
          New-Item -ItemType Directory -Force -Path "../../dist"
          dotnet restore -r win-x64
          dotnet publish -c Release -r win-x64 /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false /p:Version=${{ needs.prepare.outputs.app_version }} -o "../../dist" -p:DebugType=none -p:DebugSymbols=false
          cd "../../dist"
          Rename-Item -Path "MChub.Desktop.exe" -NewName "MChub.win-x64.PR-${{ github.event.number }}.exe" -Force
          Compress-Archive -Path "MChub.win-x64.PR-${{ github.event.number }}.exe" -DestinationPath "../MChub.win-x64.PR-${{ github.event.number }}.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MChub.win-x64.PR-${{ github.event.number }}
          path: ./MChub.*.zip
          retention-days: 7

  linux-x64-build:
    runs-on: ubuntu-22.04
    needs: prepare
    env:
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Build Linux x64
        run: dotnet build ./src/MChub.Desktop/MChub.Desktop.csproj -c Release -r linux-x64

  comment-pr:
    runs-on: ubuntu-latest
    needs: [prepare, win-x64-build, linux-x64-build]
    steps:
      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            PR 自动化构建已完成

            win.x64 版本下载链接：
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          comment-tag: pr_build_status_comment
