name: build/android

on:
  push:
    branches: [main]
    paths:
      - 'src/MChub.Android/**'
      - 'src/MChub.Core/**'
      - 'src/MChub.Localization/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    env:
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
    steps:
      # 基座库与其它私有包发布在 GitHub Packages，还原前必须先配好凭据。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Android workload
        run: dotnet workload install android

      # native 启动层（创建 JVM 的 libmchubjvm.so）必须先用 NDK 构建，
      # 否则随 APK 打包时这一步会跳过，装到手机上会如实提示"原生启动层未提供"。
      - name: Build native launch layer
        shell: bash
        run: |
          chmod +x src/MChub.Android/Native/build-android.sh
          src/MChub.Android/Native/build-android.sh arm64-v8a

      # 预置移动端运行时（JRE + Pojav 系 native + 移动端 LWJGL），让 APK 开箱即用、
      # 装机后无需再联网下载。运行时包由 build/mobile-runtime workflow 构建并发布。
      - name: Fetch prebuilt mobile runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_TAG: mobile-runtime-v1
        run: |
          set -euo pipefail
          rm -rf /tmp/mobile-runtime && mkdir -p /tmp/mobile-runtime
          if ! gh release download "$RUNTIME_TAG" -p mobile-runtime-arm64.zip -D /tmp --clobber; then
            echo "::error::取不到 mobile-runtime 包（tag=$RUNTIME_TAG）。请先跑 build/mobile-runtime workflow，否则 APK 不会带运行时。"
            exit 1
          fi
          unzip -q /tmp/mobile-runtime-arm64.zip -d /tmp/mobile-runtime

          dest=src/MChub.Android/RuntimeAssets
          rm -rf "$dest"
          mkdir -p "$dest/libs/arm64-v8a"
          # 目录名带 arm64-v8a，AndroidNativeLibrary 才能推断出目标 ABI。
          # natives/ = 不区分 LWJGL 版本的那批（自建 Pojav 系 native + OpenAL/ANGLE/SDL/GL 层）。
          cp /tmp/mobile-runtime/natives/*.so "$dest/libs/arm64-v8a/"
          # LWJGL natives 分版本存放（3.3.3 与 3.4.1 有同名 .so，不能合并），运行期按需解压。
          if [ -d /tmp/mobile-runtime/lwjgl-natives ]; then
            cp -r /tmp/mobile-runtime/lwjgl-natives "$dest/lwjgl-natives"
          fi
          cp -r /tmp/mobile-runtime/jre "$dest/jre"
          # LWJGL jar 必须先打成 zip 再进 assets：.NET Android 会把 assets 里的 .jar 当作
          # AndroidJavaLibrary（要参与 dex），而 3.3.3 与 3.4.1 有同名 jar、内容不同 → XA1014。
          # 这些 jar 只是 JVM classpath 上的条目，不需要进 dex，打包成 zip 由运行时解压即可。
          if [ -d /tmp/mobile-runtime/lwjgl ]; then
            mkdir -p "$dest/lwjgl"
            root=$(pwd)
            for d in /tmp/mobile-runtime/lwjgl/*/; do
              ver=$(basename "$d")
              (cd "$d" && zip -qr "$root/$dest/lwjgl/$ver.zip" .)
            done
            ls -la "$dest/lwjgl"
          fi
          cp /tmp/mobile-runtime/manifest.json "$dest/manifest.json"

          echo "=== 预置运行时 ==="
          echo "natives: $(ls -1 "$dest/libs/arm64-v8a" | wc -l) 个"
          echo "LWJGL natives: $(ls -1 "$dest/lwjgl-natives" 2>/dev/null | tr '\n' ' ')"
          echo "JRE: $(ls -1 "$dest/jre" | tr '\n' ' ')"
          du -sh "$dest"

      - name: Build Android (arm64)
        run: >
          dotnet build ./src/MChub.Android/MChub.Android.csproj
          -c Release
          -p:Version=0.0.0

      # 打包后核对：APK 里确实带了 native 与运行时资产，避免"看着成功其实空包"。
      - name: Verify APK contains runtime
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src/MChub.Android/bin/Release/net10.0-android -name '*.apk' | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          echo "=== lib/arm64-v8a ==="
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/.*\.so' | awk '{print $4}' | sed 's|.*/||' | sort
          echo "=== assets/runtime ==="
          unzip -l "$apk" | grep -E 'assets/runtime/' | awk '{print $4}'
          for must in libpojavexec.so \
                      assets/runtime/manifest.json \
                      assets/runtime/lwjgl-natives/3.3.3/liblwjgl.so; do
            if unzip -l "$apk" | grep -q "$must"; then
              echo "ok: $must"
            else
              echo "::error::APK 里缺少 $must"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MChub.android-arm64
          path: src/MChub.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: warn
          retention-days: 7
