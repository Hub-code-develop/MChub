name: build/android

on:
  push:
    branches: [main]
    paths:
      - 'src/MChub.Android/**'
      - 'src/MChub.Core/**'
      - 'src/MChub.Localization/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    env:
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
    steps:
      # 基座库与其它私有包发布在 GitHub Packages，还原前必须先配好凭据。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install Android workload
        run: dotnet workload install android

      # native 启动层（创建 JVM 的 libmchubjvm.so）必须先用 NDK 构建，
      # 否则随 APK 打包时这一步会跳过，装到手机上会如实提示"原生启动层未提供"。
      - name: Build native launch layer
        shell: bash
        run: |
          chmod +x src/MChub.Android/Native/build-android.sh
          src/MChub.Android/Native/build-android.sh arm64-v8a

      # 预置移动端运行时（JRE + Pojav 系 native + 移动端 LWJGL），让 APK 开箱即用、
      # 装机后无需再联网下载。运行时包由 build/mobile-runtime workflow 构建并发布。
      - name: Fetch prebuilt mobile runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_TAG: mobile-runtime-v1
        run: |
          set -euo pipefail
          rm -rf /tmp/mobile-runtime && mkdir -p /tmp/mobile-runtime
          if ! gh release download "$RUNTIME_TAG" -p mobile-runtime-arm64.zip -D /tmp --clobber; then
            echo "::error::取不到 mobile-runtime 包（tag=$RUNTIME_TAG）。请先跑 build/mobile-runtime workflow，否则 APK 不会带运行时。"
            exit 1
          fi
          unzip -q /tmp/mobile-runtime-arm64.zip -d /tmp/mobile-runtime

          dest=src/MChub.Android/RuntimeAssets
          rm -rf "$dest"
          mkdir -p "$dest"
          # 原生库打成一个 zip 进 assets —— **不进 lib/<abi>/**：
          #   ① 平台对 lib/<abi>/*.so 做 16 KB 页对齐检查，这批上游预编译产物是 4 KB 对齐，
          #      放进去会让 App 被强制「页面大小兼容模式」并在启动时弹警告（实测过）；
          #   ② 放进 lib/ 会被 .NET Android 在启动时全部 loadLibrary，触发上游 native 的 JNI_OnLoad
          #      （它们要 FindClass 自己的 Java 侧，那些类不在我们包里）→ 启动即 SIGABRT。
          # 运行时解到私有目录后由 JREUtils.loadNativeLayer / PojavRuntimeSupport 按绝对路径装载。
          root=$(pwd)
          (cd /tmp/mobile-runtime/natives && zip -qr "$root/$dest/natives.zip" .)
          # LWJGL natives 打 zip 再进 assets：.NET Android 会检查 assets 里 .so 的 ABI
          # （路径里没有 ABI 名就报 XA4301），且两套版本有同名 .so（不能同目录）。打 zip 由运行时解压。
          root=$(pwd)
          if [ -d /tmp/mobile-runtime/lwjgl-natives ]; then
            mkdir -p "$dest/lwjgl-natives"
            for d in /tmp/mobile-runtime/lwjgl-natives/*/; do
              ver=$(basename "$d")
              (cd "$d" && zip -qr "$root/$dest/lwjgl-natives/$ver.zip" .)
            done
          fi
          cp -r /tmp/mobile-runtime/jre "$dest/jre"
          # LWJGL jar 同理：.NET Android 会把 assets 里的 .jar 当作 AndroidJavaLibrary（要参与 dex），
          # 两套版本同名 jar 内容不同 → XA1014。这些 jar 只是 classpath 条目，不需要进 dex。
          if [ -d /tmp/mobile-runtime/lwjgl ]; then
            mkdir -p "$dest/lwjgl"
            for d in /tmp/mobile-runtime/lwjgl/*/; do
              ver=$(basename "$d")
              (cd "$d" && zip -qr "$root/$dest/lwjgl/$ver.zip" .)
            done
          fi
          cp /tmp/mobile-runtime/manifest.json "$dest/manifest.json"

          echo "=== 预置运行时 ==="
          echo "natives.zip: $(du -h "$dest/natives.zip" | cut -f1)（$(unzip -l "$dest/natives.zip" | tail -1 | awk '{print $2}') 个条目）"
          echo "LWJGL natives zip: $(ls -1 "$dest/lwjgl-natives" 2>/dev/null | tr '\n' ' ')"
          echo "JRE: $(ls -1 "$dest/jre" | tr '\n' ' ')"
          du -sh "$dest"

      - name: Build Android (arm64)
        run: >
          dotnet build ./src/MChub.Android/MChub.Android.csproj
          -c Release
          -p:Version=0.0.0

      # 打包后核对：APK 里确实带了运行时资产，避免"看着成功其实空包"；
      # 并卡住 16 KB 页对齐 —— 这是 Android 15+ 的硬要求，不达标会被判「页面大小兼容模式」并弹警告。
      - name: Verify APK contains runtime
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src/MChub.Android/bin/Release/net10.0-android -name '*.apk' | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          echo "=== lib/arm64-v8a ==="
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/.*\.so' | awk '{print $4}' | sed 's|.*/||' | sort
          echo "=== assets/runtime ==="
          unzip -l "$apk" | grep -E 'assets/runtime/' | awk '{print $4}'
          for must in assets/runtime/natives.zip \
                      assets/runtime/manifest.json \
                      assets/runtime/lwjgl-natives/3.3.3.zip \
                      assets/runtime/lwjgl/3.3.3.zip; do
            if unzip -l "$apk" | grep -q "$must"; then
              echo "ok: $must"
            else
              echo "::error::APK 里缺少 $must"
              exit 1
            fi
          done

          # 16 KB 页对齐检查：lib/<abi>/ 下每个 .so 的所有 PT_LOAD 段，p_align 必须 ≥ 0x4000。
          # 前端库（Pojav 系 / SDL / Mesa / JRE 自带的 libawt*）不在这里 —— 它们在
          # assets/runtime/natives.zip 里，运行时解到私有目录加载，不受这条平台检查约束。
          python3 - "$apk" <<'PY'
          import struct, sys, zipfile
          apk = sys.argv[1]
          def load_aligns(data):
              if data[:4] != b'\x7fELF':
                  return []
              phoff = struct.unpack_from('<Q', data, 0x20)[0]
              phentsize = struct.unpack_from('<H', data, 0x36)[0]
              phnum = struct.unpack_from('<H', data, 0x38)[0]
              out = []
              for i in range(phnum):
                  off = phoff + i * phentsize
                  if struct.unpack_from('<I', data, off)[0] == 1:      # PT_LOAD
                      out.append(struct.unpack_from('<Q', data, off + 0x30)[0])
              return out
          bad = []
          total = 0
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if not (name.startswith('lib/') and name.endswith('.so')):
                      continue
                  total += 1
                  aligns = load_aligns(z.read(name))
                  if aligns and min(aligns) < 0x4000:
                      bad.append((name, hex(min(aligns))))
          print(f"lib/ 下 .so 共 {total} 个，PT_LOAD 对齐不足 16 KB 的：{len(bad)}")
          for name, align in bad:
              print(f"  {name}: p_align={align}")
          if bad:
              print("::error::有原生库不是 16 KB 页对齐；放进 lib/ 会被平台判为不符合 16 KB 要求。"
                    "请把它移出 lib/（改走 assets/runtime/natives.zip + 运行时私有目录加载）。")
              sys.exit(1)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MChub.android-arm64
          path: src/MChub.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: warn
          retention-days: 7
