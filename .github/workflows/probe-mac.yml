name: probe-mac

# 临时诊断用：只跑一次 macOS 打包，用来验证 CodeNet SDK 在 runner 上的可构建性。
# 验证完成后删除本文件（它不参与发布流程）。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "runner 标签"
        required: true
        default: macos-latest
        type: choice
        options:
          - macos-latest
          - macos-15
          - macos-15-intel
          - macos-13
      rid:
        description: "目标 RID"
        required: true
        default: osx-arm64
        type: choice
        options:
          - osx-arm64
          - osx-x64
      wx:
        description: "DOTNET_EnableWriteXorExecute"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      rtver:
        description: "RuntimeFrameworkVersion（留空=SDK 默认）"
        required: false
        default: ""
        type: string
      sdk:
        description: "SDK 来源"
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
          - official

permissions:
  contents: read
  packages: read

jobs:
  probe:
    name: probe-${{ inputs.runner }}-sdk${{ inputs.sdk }}-${{ inputs.rid }}-wx${{ inputs.wx }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    steps:
      - name: Runner info
        run: |
          uname -a
          sw_vers || true
          echo "arch=$(uname -m)"
          echo "rosetta=$(/usr/bin/pgrep oahd >/dev/null && echo yes || echo no)"

      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/hub-code-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh || true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup official SDK
        if: inputs.sdk == 'official'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Setup CodeNet SDK (${{ inputs.sdk }})
        if: inputs.sdk != 'official'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODENET_VER="10.0.400"
          DEST="$RUNNER_TEMP/codenet"
          mkdir -p "$DEST"
          if [ "${{ inputs.sdk }}" = "arm64" ]; then
            ASSET="dotnet-codenet-osx-arm64-fixed.tar.gz"
          else
            ASSET="dotnet-codenet-osx-x64.tar.gz"
          fi
          gh release download "sdk-v${CODENET_VER}" -R Open-code-Studio/CodeNet -p "$ASSET" -D "$DEST"
          tar xzf "$DEST/$ASSET" -C "$DEST"
          # 两个包的顶层目录名不同（dotnet11x64 / dotnet-codenet-arm64 之类），直接探测 dotnet 可执行文件
          DOTNET_DIR=$(find "$DEST" -maxdepth 3 -type f -name dotnet -perm -111 | head -1 | xargs dirname)
          echo "SDK dir: $DOTNET_DIR"
          file "$DOTNET_DIR/dotnet"
          echo "DOTNET_ROOT=$DOTNET_DIR" >> "$GITHUB_ENV"
          echo "$DOTNET_DIR" >> "$GITHUB_PATH"
          FILEARCH=$(file -b "$DOTNET_DIR/dotnet")
          echo "SDK 二进制架构: $FILEARCH"
          "$DOTNET_DIR/dotnet" --version
          "$DOTNET_DIR/dotnet" --info 2>/dev/null | grep -iE "Architecture|RID|Version" || true

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '{"type":"release","build-time":"2026-01-01T00:00:00+08:00","action":"probe","commit":"probe","version":"1.2.0","version_title":"MChub v1.2.0"}' > ./assets/conf/version-ci.txt
          echo 'app' > ./assets/conf/package-type.txt

      - name: Build macOS App
        env:
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_EnableWriteXorExecute: ${{ inputs.wx }}
        run: |
          cd ./src/MChub.Desktop
          run_with_timeout() {
            local label="$1"; shift
            for attempt in 1 2 3; do
              echo "== $label attempt $attempt =="
              dotnet "$@" &
              local pid=$!
              ( sleep 600; kill -9 "$pid" 2>/dev/null ) &
              local killer=$!
              local rc=0
              wait "$pid" || rc=$?
              kill "$killer" 2>/dev/null || true
              if [ "$rc" -eq 0 ]; then
                echo "== $label OK =="
                return 0
              fi
              echo "== $label failed (rc=$rc), retrying =="
              pkill -9 dotnet 2>/dev/null || true
              sleep 5
            done
            echo "== $label gave up after 3 attempts =="
            return 1
          }
          run_with_timeout restore restore -r ${{ inputs.rid }} ${{ inputs.rtver != '' && format('-p:RuntimeFrameworkVersion={0}', inputs.rtver) || '' }} -m:1 /p:UseSharedCompilation=false
          run_with_timeout bundle msbuild -t:BundleApp -p:RuntimeIdentifier=${{ inputs.rid }} -property:Configuration=Release -p:SelfContained=true ${{ inputs.rtver != '' && format('-p:RuntimeFrameworkVersion={0}', inputs.rtver) || '' }} -m:1 /p:UseSharedCompilation=false

      - name: Fetch CodeNet runtime
        if: inputs.sdk == 'official'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/codenet-runtime"
          mkdir -p "$DEST"
          if [ "${{ inputs.rid }}" = "osx-arm64" ]; then
            ASSET="dotnet-codenet-osx-arm64-fixed.tar.gz"
          else
            ASSET="dotnet-codenet-osx-x64.tar.gz"
          fi
          gh release download "sdk-v10.0.400" -R Open-code-Studio/CodeNet -p "$ASSET" -D "$DEST"
          tar xzf "$DEST/$ASSET" -C "$DEST"
          LIBSRC=$(find "$DEST" -maxdepth 5 -type d -name "Microsoft.NETCore.App" | head -1)
          echo "CodeNet 运行时目录: $LIBSRC"
          ls "$LIBSRC"
          echo "CODENET_LIBS=$LIBSRC" >> "$GITHUB_ENV"

      - name: Overlay signalfix runtime
        if: inputs.sdk == 'official'
        run: |
          set -euo pipefail
          APP="./src/MChub.Desktop/bin/Release/net10.0/${{ inputs.rid }}/publish/MChub.app"
          APPRT=$(python3 -c "import json;print(json.load(open('$APP/Contents/MacOS/MChub.Desktop.runtimeconfig.json'))['runtimeOptions']['includedFrameworks'][0]['version'])")
          echo "App 运行时版本: $APPRT"
          if [ ! -d "$CODENET_LIBS/$APPRT" ]; then
            echo "::warning::CodeNet 没有 $APPRT 版本（只有 $(ls "$CODENET_LIBS" | tr '\n' ' ')），跳过叠加"
            exit 0
          fi
          for f in libcoreclr.dylib libclrjit.dylib libclrgc.dylib libclrgcexp.dylib; do
            src="$CODENET_LIBS/$APPRT/$f"; dst="$APP/Contents/MacOS/$f"
            if [ -f "$src" ] && [ -f "$dst" ]; then
              before=$(stat -f%z "$dst"); cp -f "$src" "$dst"; chmod 755 "$dst"
              echo "  $f: $before -> $(stat -f%z "$dst")"
            else
              echo "  跳过 $f"
            fi
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          echo "App 可执行文件: $(file -b "$APP/Contents/MacOS/MChub.Desktop")"

      - name: Verify bundle
        run: |
          APP="./src/MChub.Desktop/bin/Release/net10.0/${{ inputs.rid }}/publish/MChub.app"
          ls -la "$APP/Contents/MacOS" | head -20
          file "$APP/Contents/MacOS/MChub.Desktop" || true
          /usr/bin/ditto -c -k --keepParent "$APP" "/tmp/probe.${{ inputs.rid }}.app.zip"
          ls -lh "/tmp/probe.${{ inputs.rid }}.app.zip"

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ inputs.rid }}-sdk${{ inputs.sdk }}-wx${{ inputs.wx }}
          path: /tmp/probe.${{ inputs.rid }}.app.zip
          if-no-files-found: warn
