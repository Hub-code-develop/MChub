name: publish/release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_json: ${{ steps.meta.outputs.json }}
      app_version: ${{ steps.meta.outputs.app_version }}
      commit: ${{ steps.meta.outputs.commit_hash }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      base_commit: ${{ steps.meta.outputs.base_commit }}
      prev_tag: ${{ steps.meta.outputs.prev_tag }}
      release_date: ${{ steps.meta.outputs.release_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 计算版本号：支持手动指定，或从上一个 v* 标签自动递增
      - name: Generate Meta and JSON
        id: meta
        run: |
          set -euo pipefail

          BASE_COMMIT=$(git rev-parse --short=7 HEAD)
          PREV_TAG=$(git tag -l --sort=-v:refname 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$PREV_TAG" ]; then
            BASE="${PREV_TAG#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 9 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            VERSION="1.0.0"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_commit=${BASE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

          APP_VERSION="${VERSION}"
          COMMIT_HASH="${BASE_COMMIT}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date -Iseconds)
          JSON_STRING="{\"type\":\"release\",\"build-time\":\"${BUILD_TIME}\",\"action\":\"${{ github.run_id }}\",\"commit\":\"${COMMIT_HASH}\",\"version\":\"${VERSION}\",\"version_title\":\"MChub v${VERSION}\"}"
          echo "json=${JSON_STRING}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Version Tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${{ steps.meta.outputs.version }}" >/dev/null; then
            echo "版本标签 v${{ steps.meta.outputs.version }} 已存在，跳过创建。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "v${{ steps.meta.outputs.version }}"
            git push origin "v${{ steps.meta.outputs.version }}"
          fi

  linux-package:
    # x64 走 x86_64 runner；arm64 走原生 arm64 runner。
    # rpm 的 rpmbuild 无法在 x86_64 宿主上交叉编译 arm64（No compatible architectures found for build），
    # 所以 arm64 rpm 必须放在 arm64 runner 上构建（公开仓库可用 ubuntu-*-arm）。
    runs-on: ${{ matrix.runs_on }}
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: appimage
            package_type: appimage
            runtime: linux-x64
            output: MChub.linux.x64.AppImage
            runs_on: ubuntu-22.04
          - kind: deb
            package_type: deb
            runtime: linux-x64
            output: MChub.linux.x64.deb
            runs_on: ubuntu-22.04
          - kind: rpm
            package_type: rpm
            runtime: linux-x64
            output: MChub.linux.x64.rpm
            runs_on: ubuntu-22.04
          - kind: appimage
            package_type: appimage
            runtime: linux-arm64
            output: MChub.linux.arm64.AppImage
            runs_on: ubuntu-22.04-arm
          - kind: deb
            package_type: deb
            runtime: linux-arm64
            output: MChub.linux.arm64.deb
            runs_on: ubuntu-22.04-arm
          # rpm arm64 skipped: PupNet 生成的 rpm spec 在 arm64 宿主上仍报
          # "No compatible architectures found for build"（x64/arm64 宿主均复现），
          # 属 PupNet 对 arm64 rpm 的生成缺陷。arm64 Linux 用户请用 deb 或 AppImage。
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/CodeHub-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo '${{ matrix.package_type }}' > ./assets/conf/package-type.txt

      - name: Dependency
        run: |
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0
          sudo apt-get update && sudo apt-get install -y fuse rpm

      - name: Build ${{ matrix.kind }} Package
        run: |
          cd ./assets/conf
          pupnet --runtime ${{ matrix.runtime }} --kind ${{ matrix.kind }} -o ${{ matrix.output }} -y --app-version ${{ needs.prepare.outputs.app_version }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.kind }}-artifacts
          path: assets/conf/Deploy/OUT/${{ matrix.output }}

  win-exe:
    runs-on: windows-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/CodeHub-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'portable' > ./assets/conf/package-type.txt
        shell: bash

      - name: Build & Package
        shell: pwsh
        run: |
          cd ./src/MChub.Desktop
          New-Item -ItemType Directory -Force -Path "../../dist"
          dotnet restore -r ${{ matrix.runtime }}
          dotnet publish -c Release -r ${{ matrix.runtime }} /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:SelfContained=false /p:Version=${{ needs.prepare.outputs.app_version }} -o "../../dist" -p:DebugType=none -p:DebugSymbols=false
          cd "../../dist"
          Rename-Item -Path "MChub.Desktop.exe" -NewName "MChub.win.${{ matrix.arch }}.portable.exe" -Force
          Compress-Archive -Path "MChub.win.${{ matrix.arch }}.portable.exe" -DestinationPath "../MChub.win.${{ matrix.arch }}.portable.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-exe-win.${{ matrix.arch }}-artifacts
          path: ./MChub.*.zip

  win-installer:
    runs-on: windows-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/CodeHub-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'
        shell: bash

      - name: Dependencies
        run: |
          choco install innosetup -y
          dotnet tool install -g KuiperZone.PupNet --version 1.8.0

      - name: Chinesize-InnoSetup
        run: Copy-Item "./assets/conf/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Default.isl" -Force

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'installer' > ./assets/conf/package-type.txt
        shell: bash

      - name: Build & Package
        shell: pwsh
        run: |
          cd ./assets/conf
          pupnet -r ${{ matrix.runtime }} -k setup -y -o MChub.win.${{ matrix.arch }}.installer.exe --app-version ${{ needs.prepare.outputs.app_version }}
          ../../scripts/configure-windows-installer.ps1 -Runtime ${{ matrix.runtime }}
          Compress-Archive -Path "Deploy/OUT/MChub.win.${{ matrix.arch }}.installer.exe" -DestinationPath "Deploy/OUT/MChub.win.${{ matrix.arch }}.installer.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-installer-win.${{ matrix.arch }}-artifacts
          path: assets/conf/Deploy/OUT/MChub.win.*.installer.zip

  mac-dmg:
    runs-on: macos-latest
    needs: prepare
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
      GRAVITYCONE_UPTIME_API_KEY: ${{ secrets.GRAVITYCONE_UPTIME_API_KEY }}
      PRE_MC_KEY: ${{ secrets.PRE_MC_KEY }}
      REL_MC_KEY: ${{ secrets.REL_MC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-x64, osx-arm64]
        include:
          - rid: osx-x64
            dmg_arch: x64
          - rid: osx-arm64
            dmg_arch: arm64
    steps:
      # 基座库 CodeHub-FluentUI 发布在 GitHub Packages。该源即使包是公开的也要求认证
      # （实测匿名请求服务索引与包下载均 401），所以每个会还原的作业都要先配好凭据。
      # 显式指定 bash：Windows runner 默认 PowerShell，续行符 \ 会被判为语法错误，
      # 因此这里写成单行，三种系统下行为一致。
      - name: Configure NuGet (GitHub Packages)
        shell: bash
        run: |-
          dotnet nuget add source "https://nuget.pkg.github.com/CodeHub-develop/index.json" --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name codehub-gh

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup CodeNet SDK (macOS 定制版 .NET)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CODENET_VER="10.0.400"
          # 统一用 x64 SDK 交叉构建（含 osx-arm64）：
          # arm64 的 CodeNet SDK 在 macOS 26 arm64 runner 上 signalfix 有竞态，
          # dotnet restore -r osx-arm64 概率性 Segmentation fault 139（实测 run 35596627434）。
          # x64 SDK 稳定，且其 packs 里自带 signalfix 版 arm64 原生库
          # （libcoreclr 6144016 / libclrjit 3061968 / libclrgc 882208 / libclrgcexp 960800），
          # 因此 x64 宿主交叉构建出的 arm64 产物同样是修复版。x64 宿主在 arm64 runner 上可运行（有 Rosetta）。
          ASSET="dotnet-codenet-osx-x64.tar.gz"
          DEST="$RUNNER_TEMP/codenet"
          mkdir -p "$DEST"
          echo "从 Open-code-Studio/CodeNet 发布下载定制版 .NET SDK (sdk-v${CODENET_VER}, x64 → 交叉构建 ${{ matrix.rid }}) ..."
          gh release download "sdk-v${CODENET_VER}" -R Open-code-Studio/CodeNet -p "$ASSET" -D "$DEST"
          tar xzf "$DEST/$ASSET" -C "$DEST"
          echo "DOTNET_ROOT=$DEST/dotnet11x64" >> "$GITHUB_ENV"
          echo "$DEST/dotnet11x64" >> "$GITHUB_PATH"
          "$DEST/dotnet11x64/dotnet" --version
          "$DEST/dotnet11x64/dotnet" --info 2>/dev/null | grep Architecture

      - name: Update Submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive 'branch=$(git config -f "$toplevel/.gitmodules" --get "submodule.$name.branch" || echo main); git fetch origin "$branch" && git checkout -B "$branch" "origin/$branch"'

      - name: Write CI Config
        run: |
          echo '${{ needs.prepare.outputs.version_json }}' > ./assets/conf/version-ci.txt
          echo 'app' > ./assets/conf/package-type.txt

      - name: Build macOS App
        run: |
          cd ./src/MChub.Desktop
          # CodeNet x64 SDK 在 Rosetta 下交叉构建 osx-arm64 会概率性死锁：
          # 轻则卡在 restore 的 "Determining projects to restore..."，
          # 重则 BundleApp 编译阶段静默挂起直到 GitHub 6h 超时（实测多次）。
          # 给每个 dotnet 调用套 600s 超时，挂起即 kill 重试，最多 3 次。
          run_with_timeout() {
            local label="$1"; shift
            for attempt in 1 2 3; do
              echo "== $label attempt $attempt =="
              dotnet "$@" &
              local pid=$!
              ( sleep 600; kill -9 "$pid" 2>/dev/null ) &
              local killer=$!
              # GitHub 默认 shell 带 -e，wait 直接返回非 0 会终止脚本，导致重试分支永远不执行
              local rc=0
              wait "$pid" || rc=$?
              kill "$killer" 2>/dev/null || true
              if [ "$rc" -eq 0 ]; then
                echo "== $label OK =="
                return 0
              fi
              echo "== $label failed (rc=$rc), retrying =="
              pkill -9 dotnet 2>/dev/null || true
              sleep 5
            done
            echo "== $label gave up after 3 attempts =="
            return 1
          }
          run_with_timeout restore restore -r ${{ matrix.rid }}
          run_with_timeout bundle msbuild -t:BundleApp -p:RuntimeIdentifier=${{ matrix.rid }} -property:Configuration=Release -p:SelfContained=true

      # DotNet.Bundle 不支持 CFBundleURLTypes，mchub:// 协议声明在打包后写入 Info.plist
      - name: Declare mchub URL Scheme
        run: |
          PLIST="./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string hub.code.mchub" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLRole string Viewer" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string mchub" "$PLIST"

      - name: Package APP to ZIP
        run: |
          cd ./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/
          /usr/bin/ditto -c -k --keepParent MChub.app ../../../../../../../MChub.osx.mac.${{ matrix.dmg_arch }}.app.zip

      # macOS Runner 预装的 aws/tap 未受信任，会导致 brew 输出警告，构建 DMG 前先移除
      - name: Untap Untrusted Homebrew Taps
        run: brew untap aws/tap || true

      - name: Build DMG
        uses: L-Super/create-dmg-actions@v1.1.0
        with:
          dmg_name: "MChub.osx.mac.${{ matrix.dmg_arch }}"
          src_dir: "./src/MChub.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish/MChub.app"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-${{ matrix.dmg_arch }}-artifacts
          path: |
            ./MChub.osx.mac.${{ matrix.dmg_arch }}.dmg
            ./MChub.osx.mac.${{ matrix.dmg_arch }}.app.zip

  publish:
    needs: [prepare, linux-package, win-exe, win-installer, mac-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./MChub.Release/
          merge-multiple: true

      - name: List Files
        run: ls -la ./MChub.Release/

      - name: Generate Release Body
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          PREV_TAG="${{ needs.prepare.outputs.prev_tag }}"
          BASE_COMMIT="${{ needs.prepare.outputs.base_commit }}"
          RELEASE_DATE="${{ needs.prepare.outputs.release_date }}"

          {
            echo "MChub v${VERSION}"
            echo "发布日期：${RELEASE_DATE}"
            echo "基准提交：\`${BASE_COMMIT}\`"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "更新日志（自 ${PREV_TAG}）："
              echo ""
              git log --no-merges --pretty=tformat:"- %s ([%h](${REPO_URL}/commit/%H))" "${PREV_TAG}..HEAD"
              echo ""
              echo "**完整对比**: ${REPO_URL}/compare/${PREV_TAG}...${TAG}"
            else
              ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD | head -n1)
              echo "更新日志（首个正式版本）："
              echo ""
              git log --no-merges --pretty=tformat:"- %s ([%h](${REPO_URL}/commit/%H))" "${ROOT_COMMIT}..HEAD"
            fi
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "MChub v${{ needs.prepare.outputs.version }}"
          body_path: RELEASE_BODY.md
          files: |
            ./MChub.Release/*.dmg
            ./MChub.Release/*.zip
            ./MChub.Release/*.AppImage
            ./MChub.Release/*.deb
            ./MChub.Release/*.rpm

      - name: Package All Builds
        run: |
          cd ./MChub.Release
          zip -qr ../MChub.v${{ needs.prepare.outputs.version }}.all-builds.zip .
          ls -lh ../MChub.v${{ needs.prepare.outputs.version }}.all-builds.zip

      - name: Upload All Builds Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MChub.v${{ needs.prepare.outputs.version }}.all-builds
          path: ./MChub.v${{ needs.prepare.outputs.version }}.all-builds.zip
